name: Deployment Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-dev:
    name: Validate DEV Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changed paths
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"

          printf '%s\n' "$changed_files"

          if grep -q '^deploy/' <<< "$changed_files"; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -q '^argocd/' <<< "$changed_files"; then
            echo "argocd=true" >> "$GITHUB_OUTPUT"
          else
            echo "argocd=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -q '^ingress/' <<< "$changed_files"; then
            echo "ingress=true" >> "$GITHUB_OUTPUT"
          else
            echo "ingress=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify kubectl
        if: steps.changes.outputs.deploy == 'true' || steps.changes.outputs.argocd == 'true' || steps.changes.outputs.ingress == 'true'
        run: kubectl version --client

      - name: Render DEV manifests
        if: steps.changes.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail

          kubectl kustomize deploy/overlays/dev \
            > /tmp/dev-manifests.yaml

          cat /tmp/dev-manifests.yaml

      - name: Install kubeconform
        if: steps.changes.outputs.deploy == 'true' || steps.changes.outputs.argocd == 'true' || steps.changes.outputs.ingress == 'true'
        shell: bash
        run: |
          set -euo pipefail

          KUBECONFORM_VERSION="v0.8.0"

          curl -fsSL \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            -o /tmp/kubeconform.tar.gz

          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform

          kubeconform -v

      - name: Validate DEV manifests
        if: steps.changes.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail

          kubeconform \
            -strict \
            -summary \
            -kubernetes-version 1.30.14 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/CustomResourceDefinition/catalog/main/schema/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/dev-manifests.yaml

      - name: Validate Argo CD manifests
        if: steps.changes.outputs.argocd == 'true'
        shell: bash
        run: |
          set -euo pipefail

          kubeconform \
            -strict \
            -summary \
            -kubernetes-version 1.30.14 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/CustomResourceDefinition/catalog/main/schema/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            argocd/application-dev.yaml \
            argocd/project.yaml \
            argocd/bootstrap-application.yaml \
            argocd/bootstrap-project.yaml

      - name: Validate ingress manifests
        if: steps.changes.outputs.ingress == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' -t manifests < <(
            find ingress -type f \( -name '*.yaml' -o -name '*.yml' \) -print0
          )

          if (( ${#manifests[@]} == 0 )); then
            echo "No ingress manifests found."
            exit 1
          fi

          kubeconform \
            -strict \
            -summary \
            -kubernetes-version 1.30.14 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/CustomResourceDefinition/catalog/main/schema/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "${manifests[@]}"

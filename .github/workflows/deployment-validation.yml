name: Deployment Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "deploy/**"
      - "argocd/**"

permissions:
  contents: read

jobs:
  validate-dev:
    name: Validate DEV Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify kubectl
        run: kubectl version --client

      - name: Render DEV manifests
        shell: bash
        run: |
          set -euo pipefail

          kubectl kustomize deploy/overlays/dev \
            > /tmp/dev-manifests.yaml

          cat /tmp/dev-manifests.yaml

      - name: Install kubeconform
        shell: bash
        run: |
          set -euo pipefail

          KUBECONFORM_VERSION="v0.8.0"

          curl -fsSL \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            -o /tmp/kubeconform.tar.gz

          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform

          kubeconform -v

      - name: Validate DEV manifests
        shell: bash
        run: |
          set -euo pipefail

          kubeconform \
            -strict \
            -summary \
            -kubernetes-version 1.30.14 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/CustomResourceDefinition/catalog/main/schema/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/dev-manifests.yaml

      - name: Validate Argo CD manifests
        shell: bash
        run: |
          set -euo pipefail

          kubeconform \
            -strict \
            -summary \
            -kubernetes-version 1.30.14 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/CustomResourceDefinition/catalog/main/schema/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            argocd/application-dev.yaml \
            argocd/project.yaml
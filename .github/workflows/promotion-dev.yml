name: DEV Promotion

on:
  workflow_call:
    inputs:
      image_digest:
        description: Immutable container image digest
        required: true
        type: string
      source_sha:
        description: Source commit that produced the image
        required: true
        type: string

jobs:
  prepare:
    name: Prepare DEV Promotion
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PROMOTION_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROMOTION_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Validate promotion input
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_DIGEST="${{ inputs.image_digest }}"
          SOURCE_SHA="${{ inputs.source_sha }}"

          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid image digest: $IMAGE_DIGEST"
            exit 1
          fi

          if [[ ! "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Invalid source SHA: $SOURCE_SHA"
            exit 1
          fi

          echo "DEV promotion input validated."
          echo "Source SHA: $SOURCE_SHA"
          echo "Image digest: $IMAGE_DIGEST"

      - name: Update DEV image digest
        shell: bash
        run: |
          set -euo pipefail

          FILE="deploy/overlays/dev/kustomization.yaml"
          IMAGE_DIGEST="${{ inputs.image_digest }}"

          sed -i \
            "s|^[[:space:]]*digest: sha256:[a-f0-9]\{64\}|    digest: ${IMAGE_DIGEST}|" \
            "$FILE"

          if [[ -n "$(tail -c 1 "$FILE")" ]]; then
            printf '\n' >> "$FILE"
          fi

          grep -F "digest: ${IMAGE_DIGEST}" "$FILE"

      - name: Verify promotion change
        shell: bash
        run: |
          set -euo pipefail

          CHANGED_FILES="$(git diff --name-only)"

          if [[ "$CHANGED_FILES" != "deploy/overlays/dev/kustomization.yaml" ]]; then
            echo "Unexpected files changed:"
            echo "$CHANGED_FILES"
            exit 1
          fi

          git diff --check
          git diff -- deploy/overlays/dev/kustomization.yaml

      - name: Create promotion branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_SHA="${{ inputs.source_sha }}"
          SHORT_SHA="${SOURCE_SHA:0:7}"
          BRANCH_NAME="automation/promote-dev-${SHORT_SHA}"

          git checkout -b "$BRANCH_NAME"

          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Commit DEV promotion
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add deploy/overlays/dev/kustomization.yaml

          git commit \
            -m "chore: promote application image to dev"

      - name: Push promotion branch
        shell: bash
        run: |
          set -euo pipefail

          git push --set-upstream origin "${{ steps.branch.outputs.branch_name }}"

      - name: Create DEV promotion pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH_NAME: ${{ steps.branch.outputs.branch_name }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail

          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "Promote application image to DEV" \
            --body "## Summary

          Promotes the application image produced from source commit \`$SOURCE_SHA\` to DEV.

          ## Image

          \`$IMAGE_DIGEST\`

          ## Changes

          - Updates the DEV Kustomize image digest.
          - Preserves the immutable image produced by CI.
          - Does not rebuild the application image."

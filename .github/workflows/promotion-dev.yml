name: DEV Promotion

on:
  workflow_call:
    inputs:
      image_digest:
        description: Immutable container image digest
        required: true
        type: string
      source_sha:
        description: Source commit that produced the image
        required: true
        type: string

jobs:
  prepare:
    name: Prepare DEV Promotion
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate promotion input
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_DIGEST="${{ inputs.image_digest }}"
          SOURCE_SHA="${{ inputs.source_sha }}"

          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid image digest: $IMAGE_DIGEST"
            exit 1
          fi

          if [[ ! "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Invalid source SHA: $SOURCE_SHA"
            exit 1
          fi

          echo "DEV promotion input validated."
          echo "Source SHA: $SOURCE_SHA"
          echo "Image digest: $IMAGE_DIGEST"

      - name: Update DEV image digest
        shell: bash
        run: |
          set -euo pipefail

          FILE="deploy/overlays/dev/kustomization.yaml"
          IMAGE_DIGEST="${{ inputs.image_digest }}"

          sed -i \
            "s|^[[:space:]]*digest: sha256:[a-f0-9]\{64\}|    digest: ${IMAGE_DIGEST}|" \
            "$FILE"

          grep -F "digest: ${IMAGE_DIGEST}" "$FILE"

      - name: Verify promotion change
        shell: bash
        run: |
          set -euo pipefail

          CHANGED_FILES="$(git diff --name-only)"

          if [[ "$CHANGED_FILES" != "deploy/overlays/dev/kustomization.yaml" ]]; then
            echo "Unexpected files changed:"
            echo "$CHANGED_FILES"
            exit 1
          fi

          git diff --check
          git diff -- deploy/overlays/dev/kustomization.yaml

name: CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/ci.yml"

  push:
    branches:
      - main
    paths:
      - "app/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Application
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt

      - name: Validate dependencies
        run: python -m pip check

      - name: Validate Python syntax
        run: python -m compileall -q app

      - name: Validate application import
        run: python -c "from app.app import app; print('Application import successful')"

  container:
    name: Build Container Image
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to container registry
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build container image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ vars.REGISTRY_HOST }}/${{ vars.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=main
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=main,mode=max' || '' }}

      - name: Record published image
        if: github.event_name == 'push'
        run: |
          echo "Image tag: ${{ vars.REGISTRY_HOST }}/${{ vars.IMAGE_NAME }}:${{ github.sha }}"
          echo "Image digest: ${{ steps.build.outputs.digest }}"
          echo "Immutable reference: ${{ vars.REGISTRY_HOST }}/${{ vars.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"

  promote-dev:
    name: Promote Image to DEV
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: container

    uses: ./.github/workflows/promotion-dev.yml

    with:
      image_digest: ${{ needs.container.outputs.image_digest }}
      source_sha: ${{ github.sha }}

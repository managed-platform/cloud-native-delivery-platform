apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: argocd-bootstrap
  namespace: argocd

spec:
  project: argocd-bootstrap-project

  source:
    repoURL: https://github.com/managed-platform/cloud-native-delivery-platform.git
    targetRevision: main
    path: argocd

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
      prune: true
